[project]
name = "sakura-core"
version = "0.1.0"
description = "SakuraIM Core - message routing and session management"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asq>=2.0.0",
    "fastapi>=0.136.3",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
    "sqlmodel>=0.0.38",
    "sakura-protocol",
    "uvicorn>=0.49.0",
]

[tool.uv.sources]
sakura-protocol = { workspace = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
