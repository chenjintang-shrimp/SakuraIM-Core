[project]
name = "sakura-oss"
version = "0.1.0"
description = "SakuraIM temporary attachment object cache"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
