[tool.uv.workspace]
members = [
    "packages/sakura-protocol",
    "packages/sakura-core",
    "packages/sakura-oss",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/sakura-core/src",
    "packages/sakura-oss/src",
    "packages/sakura-protocol/src",
]
